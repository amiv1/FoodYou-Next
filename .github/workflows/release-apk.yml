name: Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Setup Android SDK build tools
        run: |
          $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager "build-tools;36.0.0"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(grep '^version-name' gradle/libs.versions.toml | sed -E 's/version-name = "(.*)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Align and sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          APK_NAME: food-you-next-${{ steps.app_version.outputs.version }}.apk
        run: |
          echo ${KEYSTORE_BASE64} | base64 -d > keystore

          echo "Aligning APK..."

          zipalign -f -p -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            aligned.apk

          echo "Signing APK with keystore..."

          apksigner sign \
            --alignment-preserved \
            --ks keystore \
            --ks-key-alias ${KEY_ALIAS} \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --out "${APK_NAME}" \
            aligned.apk
          
          echo "APK signed successfully."

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: food-you-next-${{ steps.app_version.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: food-you-next-${{ steps.app_version.outputs.version }}.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
